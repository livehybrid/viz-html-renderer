[html_renderer]
label = HTML Renderer
description = Render arbitrary HTML inside a Dashboard Studio panel. Supports {{field}} interpolation from search results, theme-aware CSS variables, and optional script execution.
framework_type = studio_visualization
search_fragment = | makeresults | eval message="Hello world" | table message
default_height = 200
allow_user_selection = true
disabled = false

[html_renderer.htmlTemplate]
label = HTML Template
fieldType = textarea
defaultValue = <div style="padding:12px"><h2 style="margin:0 0 8px;color:var(--accent)">{{message}}</h2><p style="margin:0;opacity:0.7">Edit this HTML in the formatter panel.</p></div>

[html_renderer.allowScripts]
label = Allow Scripts (DANGEROUS)
fieldType = radio
defaultValue = 0

[html_renderer.theme]
label = Theme
fieldType = dropdown
defaultValue = auto
allowStrings = true
