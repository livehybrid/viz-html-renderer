version: 2
updates:
  # GitHub Actions used by the CI/release workflow
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Dev-only test tooling (jest + Playwright). Nothing here ships in the app
  # package; the unit + e2e CI jobs gate every bump.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "test"
    labels:
      - "dependencies"
      - "javascript"
