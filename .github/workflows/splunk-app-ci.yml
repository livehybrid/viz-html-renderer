name: Splunk App CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"

permissions:
  pull-requests: write
  actions: write
  checks: write
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Determine version
        id: version
        shell: bash
        run: |
          SHORT_COMMIT_HASH=$(git rev-parse --short HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
          else
            TAG_VERSION="1.0.0"
          fi
          VERSION_WITH_HASH="${TAG_VERSION}+${SHORT_COMMIT_HASH}"
          echo "VERSION_WITH_HASH=${VERSION_WITH_HASH}" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=${TAG_VERSION}" >> $GITHUB_OUTPUT

      - name: Stage app
        shell: bash
        run: |
          mkdir -p stage/viz-html-renderer
          rsync -a \
                --exclude '.git' \
                --exclude '.github' \
                --exclude '.gitignore' \
                --exclude '.gitattributes' \
                --exclude '.editorconfig' \
                --exclude '.prettierrc' \
                --exclude 'stage' \
                --exclude 'dist' \
                --exclude 'node_modules' \
                --exclude '*.tar.gz' \
                --exclude '.DS_Store' \
                --exclude '/tests' \
                --exclude '/e2e' \
                --exclude '/docker' \
                --exclude '/playwright.config.js' \
                --exclude '/package.json' \
                --exclude '/package-lock.json' \
                --exclude 'e2e-results' \
                --exclude '/splunkbase' \
                ./ stage/viz-html-renderer/
          # Normalise permissions — AppInspect rejects 775/664. App dirs 755, files 644.
          find stage/viz-html-renderer -type d -exec chmod 755 {} +
          find stage/viz-html-renderer -type f -exec chmod 644 {} +
          ls -la stage/viz-html-renderer/

      - name: Update app version
        working-directory: stage/viz-html-renderer
        shell: bash
        run: |
          if [ -f "default/app.conf" ]; then
            sed -i "s/^version = .*/version = ${{ steps.version.outputs.TAG_VERSION }}/g" default/app.conf
          fi
          if [ -f "app.manifest" ]; then
            sed -i "s/\"version\": \".*\"/\"version\": \"${{ steps.version.outputs.TAG_VERSION }}\"/g" app.manifest
          fi

      - name: Generate package tarball
        shell: bash
        run: |
          mkdir -p dist
          cd stage
          tar -czf ../dist/viz-html-renderer-${{ steps.version.outputs.VERSION_WITH_HASH }}.tar.gz viz-html-renderer/
          cd ..
          ls -la dist/

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload stage directory for inspection
        uses: actions/upload-artifact@v7
        with:
          name: stage-contents
          path: stage/viz-html-renderer/

  unit-test:
    name: unit-test (jest sanitiser + config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run jest
        run: |
          npm ci
          npm test

  e2e-playwright:
    name: e2e-playwright (real Splunk render + sanitisation)
    needs: package
    # Dependabot actors get no secrets/egress guarantees; unit + appinspect still cover them.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download staged app
        uses: actions/download-artifact@v8
        with:
          name: stage-contents
          path: stage-app
      - name: Make staged app readable by the container splunk user
        run: chmod -R 755 stage-app
      - name: Start Splunk (wait for health)
        working-directory: docker
        env:
          APP_DIR: ${{ github.workspace }}/stage-app
        run: docker compose up -d --wait --wait-timeout 420
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run e2e render check
        env:
          SPLUNK_WEB_URL: http://localhost:8000
          SPLUNK_MGMT_URL: https://localhost:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
        run: npx playwright test
      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-render
          path: e2e-results/
          if-no-files-found: ignore
      - name: Splunk logs on failure
        if: failure()
        working-directory: docker
        run: docker compose logs --tail 200 splunk || true
      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v || true

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@main
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  quality-appinspect-api:
    name: quality-appinspect-api
    needs:
      - appinspect
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-api.yml@main
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}

  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - unit-test
      - e2e-playwright
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@main
