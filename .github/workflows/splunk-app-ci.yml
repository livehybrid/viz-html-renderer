name: Splunk App CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch: {}
  schedule:
    # Weekly re-run of main, so it never goes stale unseen against new
    # Splunk, AppInspect and dependency releases. Tag-only jobs skip it.
    - cron: "58 5 * * 2"

permissions:
  pull-requests: write
  actions: write
  checks: write
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Determine version
        id: version
        shell: bash
        run: |
          SHORT_COMMIT_HASH=$(git rev-parse --short HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
          else
            TAG_VERSION="1.0.0"
          fi
          VERSION_WITH_HASH="${TAG_VERSION}+${SHORT_COMMIT_HASH}"
          echo "VERSION_WITH_HASH=${VERSION_WITH_HASH}" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=${TAG_VERSION}" >> $GITHUB_OUTPUT

      - name: Stage app
        shell: bash
        run: |
          mkdir -p stage/viz-html-renderer
          rsync -a \
                --exclude '.git' \
                --exclude '.github' \
                --exclude '.gitignore' \
                --exclude '.gitattributes' \
                --exclude '.editorconfig' \
                --exclude '.prettierrc' \
                --exclude 'stage' \
                --exclude 'dist' \
                --exclude 'node_modules' \
                --exclude '*.tar.gz' \
                --exclude '.DS_Store' \
                --exclude '/tests' \
                --exclude '/e2e' \
                --exclude '/docker' \
                --exclude '/playwright.config.js' \
                --exclude '/package.json' \
                --exclude '/package-lock.json' \
                --exclude 'e2e-results' \
                --exclude '/splunkbase' \
                ./ stage/viz-html-renderer/
          # Normalise permissions — AppInspect rejects 775/664. App dirs 755, files 644.
          find stage/viz-html-renderer -type d -exec chmod 755 {} +
          find stage/viz-html-renderer -type f -exec chmod 644 {} +
          ls -la stage/viz-html-renderer/

      - name: Update app version
        working-directory: stage/viz-html-renderer
        shell: bash
        run: |
          if [ -f "default/app.conf" ]; then
            sed -i "s/^version = .*/version = ${{ steps.version.outputs.TAG_VERSION }}/g" default/app.conf
          fi
          if [ -f "app.manifest" ]; then
            sed -i "s/\"version\": \".*\"/\"version\": \"${{ steps.version.outputs.TAG_VERSION }}\"/g" app.manifest
          fi
          # Every release must change `build` as well as `version` (app.conf.spec:
          # "Ensures browsers don't use cached copies of old static files").
          # build = 1 on every release left upgraded users on the old cached JS.
          # Derived from the version (1.0.8 -> 10008): reproducible, always rises.
          V="${{ steps.version.outputs.TAG_VERSION }}"
          IFS=. read -r MAJ MIN PAT <<< "${V%%[-+]*}"
          if (( 10#$MIN > 99 || 10#${PAT:-0} > 99 )); then
            echo "::error::version $V does not fit the build scheme"; exit 1
          fi
          BUILD=$(( 10#$MAJ * 10000 + 10#$MIN * 100 + 10#${PAT:-0} ))
          if grep -q '^build *=' default/app.conf; then
            sed -i "s/^build *=.*/build = ${BUILD}/" default/app.conf
          else
            sed -i "/^\[install\]/a build = ${BUILD}" default/app.conf
          fi
          grep -q "^build = ${BUILD}$" default/app.conf

      - name: Generate package tarball
        shell: bash
        run: |
          mkdir -p dist
          cd stage
          tar -czf ../dist/viz-html-renderer-${{ steps.version.outputs.VERSION_WITH_HASH }}.tar.gz viz-html-renderer/
          cd ..
          ls -la dist/

      - name: Verify package metadata
        # Reads the tarball itself, not the stage directory the stamp edited.
        shell: bash
        env:
          TAG_VERSION: ${{ steps.version.outputs.TAG_VERSION }}
        run: |
          python3 - dist/*.tar.gz <<'PY'
          import configparser, os, sys, tarfile
          want = os.environ["TAG_VERSION"]
          parts = [int(p) for p in want.split("+")[0].split("-")[0].split(".")]
          parts += [0] * (3 - len(parts))
          expected = str(parts[0] * 10000 + parts[1] * 100 + parts[2])
          with tarfile.open(sys.argv[1]) as tar:
              raw = tar.extractfile("viz-html-renderer/default/app.conf").read().decode()
          conf = configparser.ConfigParser(interpolation=None, strict=False)
          conf.read_string(raw)
          got = {"build": conf.get("install", "build", fallback=None),
                 "launcher.version": conf.get("launcher", "version", fallback=None),
                 "id.version": conf.get("id", "version", fallback=None)}
          print(got)
          bad = [k for k, v in got.items() if v != (expected if k == "build" else want)]
          if bad:
              sys.exit(f"app.conf in the package is wrong for {want}: {bad} (build should be {expected})")
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload stage directory for inspection
        uses: actions/upload-artifact@v7
        with:
          name: stage-contents
          path: stage/viz-html-renderer/

  unit-test:
    name: unit-test (jest sanitiser + config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run jest
        run: |
          npm ci
          npm test

  e2e-playwright:
    name: e2e-playwright (real Splunk render + sanitisation)
    needs: package
    # Dependabot actors get no secrets/egress guarantees; unit + appinspect still cover them.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 10.4.0 is what the viz was built and first released on; 10.6.0 is current.
        splunk: ["10.4.0", "10.6.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download staged app
        uses: actions/download-artifact@v8
        with:
          name: stage-contents
          path: stage-app
      - name: Make staged app readable by the container splunk user
        run: chmod -R 755 stage-app
      - name: Start Splunk (wait for health)
        working-directory: docker
        env:
          APP_DIR: ${{ github.workspace }}/stage-app
          SPLUNK_IMAGE_TAG: ${{ matrix.splunk }}
        run: docker compose up -d --wait --wait-timeout 420
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run e2e render check
        env:
          SPLUNK_WEB_URL: http://localhost:8000
          SPLUNK_MGMT_URL: https://localhost:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
        run: npx playwright test
      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-render-${{ matrix.splunk }}
          path: e2e-results/
          if-no-files-found: ignore
      - name: Splunk logs on failure
        if: failure()
        working-directory: docker
        run: docker compose logs --tail 200 splunk || true
      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v || true

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@main
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  quality-appinspect-api:
    name: quality-appinspect-api
    needs:
      - appinspect
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-api.yml@main
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}

  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - unit-test
      - e2e-playwright
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@main

  publish-splunkbase:
    # Tag runs only: needs the GitHub release (every CLI gate + e2e) and
    # Splunk's hosted AppInspect. Uploads stay off until the repo variable
    # SPLUNKBASE_PUBLISH_ENABLED=true.
    needs:
      - publish-gh
      - quality-appinspect-api
    permissions:
      contents: read
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish-splunkbase.yml@main
    with:
      app_id: "8815"
      splunk_versions: "10.6,10.5,10.4"
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
